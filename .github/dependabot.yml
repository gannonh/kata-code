version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@earendil-works/pi-*"
    groups:
      pi-runtime:
        patterns:
          - "@earendil-works/pi-*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(pi)"
