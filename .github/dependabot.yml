# Dependabot version updates with a minimum package age (cooldown).
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-
# Dependabot requires a unique (ecosystem, directory, target-branch) triple, so
# npm cannot split into daily-Pi + weekly-rest lanes on `/`. One daily npm update
# keeps Pi actionable via group + cooldown exclusion; other deps use cooldown.
#
# Group matching: Dependabot may prefer more "specific" groups (e.g. those with
# dependency-type) over pattern-only groups. Exclude Pi from the catch-all
# production/development groups so `pi-runtime` actually owns `@earendil-works/pi-*`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Wait until a release has been on the registry for N days before opening a PR.
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
      exclude:
        - "@earendil-works/pi-*"
    groups:
      pi-runtime:
        patterns:
          - "@earendil-works/pi-*"
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "@earendil-works/pi-*"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@earendil-works/pi-*"
    ignore:
      # Catalog/workspace versions are managed intentionally; Dependabot still
      # covers non-catalog root and app deps plus lockfile drift.
      - dependency-name: "effect"
      - dependency-name: "@effect/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # github-actions supports cooldown.default-days only (not semver-*-days).
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
