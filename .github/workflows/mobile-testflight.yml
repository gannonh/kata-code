name: Mobile TestFlight

# Builds the production iOS app on a GitHub macOS runner and uploads it to App
# Store Connect for TestFlight. scripts/mobile-testflight.ts does the work, so a
# maintainer's Mac runs the same build; see docs/operations/release.md.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect (off builds and signs only)"
        required: false
        default: true
        type: boolean

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload iOS
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: production
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      KATACODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      KATACODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check release configuration
        shell: bash
        run: |
          set -euo pipefail
          relay_domain="${RELAY_DOMAIN:-}"
          if [[ -z "$relay_domain" && -n "${RELAY_API_ZONE_NAME:-}" ]]; then
            relay_domain="relay.$RELAY_API_ZONE_NAME"
          fi
          missing=()
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER KATACODE_CLERK_PUBLISHABLE_KEY KATACODE_CLERK_JWT_TEMPLATE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ -z "$relay_domain" ]]; then
            missing+=("RELAY_DOMAIN or RELAY_API_ZONE_NAME")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing TestFlight configuration: ${missing[*]}. See docs/operations/release.md#mobile-testflight."
            exit 1
          fi
          echo "KATACODE_RELAY_URL=https://$relay_domain" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@kata-sh/code-mobile...

      - name: Show toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Build and upload
        run: node scripts/mobile-testflight.ts ${{ inputs.upload == false && '--no-upload' || '' }}
