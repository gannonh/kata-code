name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @kata-sh/code-desktop ensure:electron

      - name: Check
        run: |
          # Vite+ can panic with EAGAIN when GitHub's log pipe backpressures
          # a large lint warning dump (`failed printing to stdout: Resource
          # temporarily unavailable`). Write to a file first, then replay.
          set +e
          vp check > "${RUNNER_TEMP}/vp-check.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/vp-check.log"
          exit "$status"

      - name: Typecheck
        run: vp run typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

      # Soft-fail: report unused/dead code without blocking PRs while baselines settle.
      - name: Knip (report only)
        continue-on-error: true
        run: vp run knip:strict

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Root monorepo suite + v8 coverage is slower than package-recursive unit tests alone.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @kata-sh/code-desktop ensure:electron

      - name: Install task check sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which denies bwrap's loopback setup (RTM_NEWADDR: EPERM) inside the
          # new network namespace. Each job gets a fresh VM, so disabling it
          # here only affects this job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pull Docker image for sandbox integration tests
        run: docker pull alpine:3.20

      # Process tests spawn the built CLI (`apps/server/dist/bin.mjs`).
      - name: Build server CLI bundle
        run: vp run --filter @kata-sh/code-cli build:bundle

      # Single run: unit suite + coverage gate (see root vite.config.ts thresholds).
      # Do not re-run `test:coverage` after this — that double-ran the suite and hit timeouts.
      - name: Test
        run: vp run test

  test_browser:
    name: Test Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install browser test runtime
        run: vp run --filter @kata-sh/code-web test:browser:install

      - name: Browser test / Chat view
        working-directory: apps/web
        run: vp test run --mode browser --browser=chromium src/components/ChatView.browser.tsx

      - name: Browser test / Chat markdown
        working-directory: apps/web
        run: vp test run --mode browser --browser=chromium src/components/ChatMarkdown.browser.tsx

      - name: Browser test / Components
        working-directory: apps/web
        run: |
          vp test run --mode browser --browser=chromium \
            src/components/GitActionsControl.browser.tsx \
            src/components/KeybindingsToast.browser.tsx \
            src/components/ThreadTerminalDrawer.browser.tsx \
            src/components/chat/MessagesTimeline.browser.tsx \
            src/components/chat/ProviderModelPicker.browser.tsx \
            src/components/chat/CompactComposerControlsMenu.browser.tsx \
            src/components/settings/SettingsPanels.browser.tsx \
            src/components/taskWorkspace/TaskWorkspaceNewView.browser.tsx \
            src/components/taskWorkspace/TaskWorkspaceView.browser.tsx

  test_task_workspaces_e2e:
    name: Test Task Workspaces E2E
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    # Task mode is in development and gated off by default. These specs exist to
    # exercise it, so the whole job opts in. Local runs inherit this from a
    # developer `.env`, which CI does not have — without it the Task surface
    # never renders and every task spec fails on a missing sidebar link.
    env:
      FF_TASK_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @kata-sh/code-desktop ensure:electron

      - name: Build desktop pipeline
        run: vp run build:desktop

      # The @agent task-workspace scenario requires maintainer-only Clerk and provider
      # credentials. Keep the credential-free task-workspace coverage in PR CI.
      - name: Run credential-free task-workspaces E2E
        run: vp exec playwright test --config e2e/playwright.config.ts --project desktop-dev --grep @task-workspaces --grep-invert @agent

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
