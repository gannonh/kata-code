name: Task Workspaces Slice 1 Diagnostic Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove diagnostic workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove diagnostic workflow
        run: |
          rm -f .github/workflows/task-workspaces-slice-1-diagnostic.yml
          git config user.name "Kata Code Agent"
          git config user.email "tasks@kata.sh"
          git add -A
          git commit -m "chore(task-workspaces): remove check diagnostics"
          git push origin "HEAD:${{ github.head_ref }}"
