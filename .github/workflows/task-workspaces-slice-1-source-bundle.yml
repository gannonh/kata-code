name: Task Workspaces Slice 1 Source Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-bundle:
    name: Source Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Capture local tooling
        run: |
          mkdir -p .tooling/bin
          cp --dereference "$(command -v vp)" .tooling/bin/vp
          cp --dereference "$(command -v node)" .tooling/bin/node
          printf '%s\n' "$(node --version)" > .tooling/node-version.txt
          printf '%s\n' "$(vp --version)" > .tooling/vp-version.txt

      - name: Create split development archive
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/kata-code-dev.tgz" .
          split -b 350m "$RUNNER_TEMP/kata-code-dev.tgz" "$RUNNER_TEMP/kata-code-dev.part-"
          ls -lh "$RUNNER_TEMP"/kata-code-dev.part-*

      - name: Upload development archive part aa
        uses: actions/upload-artifact@v4
        with:
          name: task-workspaces-slice-1-dev-aa
          path: ${{ runner.temp }}/kata-code-dev.part-aa
          retention-days: 1

      - name: Upload development archive part ab
        uses: actions/upload-artifact@v4
        with:
          name: task-workspaces-slice-1-dev-ab
          path: ${{ runner.temp }}/kata-code-dev.part-ab
          retention-days: 1

      - name: Upload development archive part ac
        uses: actions/upload-artifact@v4
        with:
          name: task-workspaces-slice-1-dev-ac
          path: ${{ runner.temp }}/kata-code-dev.part-ac
          retention-days: 1
