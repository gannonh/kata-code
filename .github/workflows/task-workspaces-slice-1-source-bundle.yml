name: Task Workspaces Slice 1 Tooling Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-bundle:
    name: Tooling Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Capture real Node runtime
        run: |
          mkdir -p "$RUNNER_TEMP/task-workspaces-tooling"
          cp --dereference "$(node -p 'process.execPath')" "$RUNNER_TEMP/task-workspaces-tooling/node"
          cp --dereference "$(command -v vp)" "$RUNNER_TEMP/task-workspaces-tooling/vp"
          node --version > "$RUNNER_TEMP/task-workspaces-tooling/node-version.txt"
          vp --version > "$RUNNER_TEMP/task-workspaces-tooling/vp-version.txt"
          file "$RUNNER_TEMP/task-workspaces-tooling/node"

      - name: Upload tooling
        uses: actions/upload-artifact@v4
        with:
          name: task-workspaces-slice-1-tooling
          path: ${{ runner.temp }}/task-workspaces-tooling
          retention-days: 1
